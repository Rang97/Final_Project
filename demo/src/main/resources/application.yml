spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: sajugame

  datasource:
    url: jdbc:mysql://localhost:3306/sajugame?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

saju:
  api:
    base-url: ${SAJU_BASE_URL}
    key: ${SAJU_API_KEY}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    connect-timeout-ms: 5000
    read-timeout-ms: 60000


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

server:
  address: 0.0.0.0
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
